name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Lint, tipos, pruebas y contrato
    runs-on: ubuntu-latest
    env:
      # Valores de build ficticios: solo se evalúa app.config.ts, no se compila nada nativo.
      APP_ANDROID_PACKAGE: mx.com.sysosa.rescate
      APP_IOS_BUNDLE_ID: mx.com.sysosa.rescate
      APP_SCHEME: alakito
      APP_LINK_DOMAIN: alakito.mx
      EXPO_PUBLIC_API_BASE_URL: https://alakito.mx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run api:check
      - run: npm run tokens:check
      - name: Configuración de Expo evaluable
        run: npx expo config --type public > /dev/null
