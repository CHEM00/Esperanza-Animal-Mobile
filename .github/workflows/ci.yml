name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Lint, tipos, pruebas y contrato
    runs-on: ubuntu-latest
    env:
      # La identidad de la app viene de config/app-identity.js; aquí solo lo que cambia
      # por entorno. No se compila nada nativo: se evalúa app.config.ts.
      EXPO_PUBLIC_API_BASE_URL: https://alakito.mx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run api:check
      - run: npm run tokens:check
      - name: Configuración de Expo evaluable
        run: npx expo config --type public > /dev/null
